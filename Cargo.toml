[workspace]
resolver = "2"
members = [
  "contracts/*",
]

[workspace.package]
authors = ["Handi Protocol Developers <dev@handiprotocol.org>"]
edition = "2021"
license = "MIT"
repository = "https://github.com/Handi-Protocol/handi"
homepage = "https://handiprotocol.org"

[workspace.dependencies]
soroban-sdk = "23.5.3"

[profile.release]
opt-level = "z"
overflow-checks = true
debug = 0
strip = "symbols"
debug-assertions = false
panic = "abort"
codegen-units = 1
lto = true

# For more information about this profile see https://soroban.stellar.org/docs/basic-tutorials/logging#cargotoml-profile
[profile.release-with-logs]
inherits = "release"
debug-assertions = true
